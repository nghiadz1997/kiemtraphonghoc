<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#2563eb" flood-opacity="0.4" />
    </filter>
  </defs>
  
  <!-- App Icon Background -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="#09090b" />
  <rect x="40" y="40" width="432" height="432" rx="104" fill="url(#bg-grad)" filter="url(#glow)" />
  
  <!-- Calendar Grid Accent -->
  <rect x="120" y="120" width="272" height="272" rx="40" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-width="4" stroke-opacity="0.25" />
  <line x1="120" y1="190" x2="392" y2="190" stroke="#ffffff" stroke-width="4" stroke-opacity="0.25" />
  
  <!-- Calendar Rings / Hooks -->
  <rect x="180" y="96" width="24" height="48" rx="12" fill="#ffffff" />
  <rect x="308" y="96" width="24" height="48" rx="12" fill="#ffffff" />
  
  <!-- Letter C in Center -->
  <text x="256" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="160" font-weight="900" fill="#ffffff" text-anchor="middle">C</text>
  
  <!-- Notification Sparkle Badge -->
  <circle cx="390" cy="120" r="32" fill="#ef4444" stroke="#ffffff" stroke-width="6" />
  <circle cx="390" cy="120" r="12" fill="#ffffff" />
</svg>
